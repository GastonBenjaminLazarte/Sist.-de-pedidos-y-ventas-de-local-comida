<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de gestión de COMANDA para empleados, repartidores y administradores.">
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
  <title>Panel de gestión | COMANDA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/bootstrap-overrides.css">
</head>
<body>
  <header class="site-header sticky-top">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container py-2">
        <a class="navbar-brand brand" href="index.html">COMANDA<span>.</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu" aria-controls="mainMenu" aria-expanded="false" aria-label="Abrir menú"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainMenu">
          <ul class="navbar-nav mx-auto gap-lg-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Cliente</a></li>
            <li class="nav-item"><a class="nav-link" href="panel.html?role=empleado">Empleado</a></li>
            <li class="nav-item"><a class="nav-link" href="panel.html?role=repartidor">Repartidor</a></li>
            <li class="nav-item"><a class="nav-link" href="panel.html?role=admin">Admin</a></li>
          </ul>
          <a class="btn btn-outline-secondary" href="index.html">Volver al inicio</a>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="py-5 section-panel">
      <div class="container">
        <div class="section-header">
          <div><p class="eyebrow">Panel de gestión</p><h1 class="h2" id="panelTitle">Acceso al panel</h1></div>
          <p class="mb-0 text-muted" id="panelDescription">Elegí tu rol para ingresar al sistema.</p>
        </div>
        <div class="login-panel card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <div class="row g-3 align-items-end">
              <div class="col-md-4"><label class="form-label" for="panelRole">Rol</label><select id="panelRole" class="form-select"><option value="empleado">Empleado</option><option value="repartidor">Repartidor</option><option value="admin">Administrador</option></select></div>
              <div class="col-md-3"><label class="form-label" for="panelUser">Usuario</label><input type="text" id="panelUser" class="form-control"></div>
              <div class="col-md-3"><label class="form-label" for="panelPass">Contraseña</label><input type="password" id="panelPass" class="form-control"></div>
              <div class="col-md-2"><button class="btn btn-primary w-100" type="button" id="btnPanelLogin">Ingresar</button></div>
            </div>
          </div>
        </div>
        <div id="panelMessage" class="small fw-bold mb-3"></div>
        <div id="employeePanel" class="panel-content d-none"></div>
        <div id="deliveryPanel" class="panel-content d-none"></div>
        <div id="adminPanel" class="panel-content d-none"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer py-4 mt-5"><div class="container d-flex flex-wrap justify-content-between align-items-center gap-3 text-muted small"><span>© 2026 COMANDA</span><span>Panel de gestión</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/panel.js"></script>
</body>
</html>
